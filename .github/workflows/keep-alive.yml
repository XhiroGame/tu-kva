name: Keep Render Backend Awake

on:
  schedule:
    # Cada 10 minutos durante horario habitual de bar (20:00 UTC a 10:00 UTC = 3:00 PM a 5:00 AM Colombia)
    - cron: '*/10 20-23,0-10 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Tu K-VA Backend Health
        run: |
          curl -fsS --max-time 30 https://tu-kva.onrender.com/api/health || echo "Ping attempted"
